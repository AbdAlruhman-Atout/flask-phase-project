{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}
<h2>Edit Course</h2>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST">
    <label for="name">Course name:</label>
    <input
        type="text"
        id="name"
        name="name"
        value="{{ course.name }}"
        required
    >
    <button type="submit">Save changes</button>
</form>

<p>
    <a href="{{ url_for(
        'courses.course_detail',
        course_id=course.id
    ) }}">
        Cancel
    </a>
</p>
{% endblock %}
