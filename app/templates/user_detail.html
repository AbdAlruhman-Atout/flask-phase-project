{% extends "base.html" %}

{% block title %}User Details{% endblock %}

{% block content %}

<h2>User Details</h2>

{% if user.profile_picture %}
    <p>
        <img
            src="{{ url_for(
                'static',
                filename=user.profile_picture
            ) }}"
            alt="Profile picture for {{ user.username }}"
            width="160"
        >
    </p>
{% else %}
    <p>No profile picture uploaded.</p>
{% endif %}

<p>
    <strong>ID:</strong>
    {{ user.id }}
</p>

<p>
    <strong>Username:</strong>
    {{ user.username }}
</p>

<p>
    <a href="{{ url_for(
        'users.edit_user',
        user_id=user.id
    ) }}">
        Edit user
    </a>
</p>

<form
    method="POST"
    action="{{ url_for(
        'users.delete_user',
        user_id=user.id
    ) }}"
>
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <button type="submit">
        Delete user
    </button>
</form>

<p>
    <a href="{{ url_for('users.user_list') }}">
        Back to users
    </a>
</p>

{% endblock %}
