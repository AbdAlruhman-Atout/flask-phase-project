{% extends "base.html" %}

{% block title %}User Details{% endblock %}

{% block content %}
<h2>User Details</h2>

<p><strong>ID:</strong> {{ user.id }}</p>
<p><strong>Username:</strong> {{ user.username }}</p>

<p>
    <a href="{{ url_for(
        'users.edit_user',
        user_id=user.id
    ) }}">
        Edit user
    </a>
</p>

<form
    method="POST"
    action="{{ url_for(
        'users.delete_user',
        user_id=user.id
    ) }}"
>
    <button type="submit">Delete user</button>
</form>

<p>
    <a href="{{ url_for('users.user_list') }}">
        Back to users
    </a>
</p>
{% endblock %}
