{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}
<h2>Edit User</h2>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST">
    <label for="username">Username:</label><br>
    <input
        type="text"
        id="username"
        name="username"
        value="{{ user.username }}"
        required
    >
    <br><br>

    <label for="password">New password:</label><br>
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Leave blank to keep current password"
    >
    <br><br>

    <button type="submit">Save changes</button>
</form>

<p>
    <a href="{{ url_for(
        'users.user_detail',
        user_id=user.id
    ) }}">
        Cancel
    </a>
</p>
{% endblock %}
