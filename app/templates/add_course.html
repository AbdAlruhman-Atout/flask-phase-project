{% extends "base.html" %}

{% block title %}Add Course{% endblock %}

{% block content %}
<h2>Add Course</h2>

{% if error %}
<p>{{ error }}</p>
{% endif %}

<form method="POST">
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >
    <label for="name">Course name:</label>
    <input
        type="text"
        id="name"
        name="name"
        required
    >
    <button type="submit">Add course</button>
</form>

<p>
    <a href="{{ url_for('courses.course_list') }}">
        Back to courses
    </a>
</p>
{% endblock %}
