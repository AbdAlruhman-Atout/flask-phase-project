{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h2>Login</h2>

<form method="POST" novalidate>
    {{ form.hidden_tag() }}

    <p>
        {{ form.username.label }}<br>
        {{ form.username() }}
    </p>

    <p>
        {{ form.password.label }}<br>
        {{ form.password() }}
    </p>

    <p>
        {{ form.submit() }}
    </p>
</form>

<p>
    Do not have an account?
    <a href="{{ url_for('auth.register') }}">
        Register
    </a>
</p>

{% endblock %}
